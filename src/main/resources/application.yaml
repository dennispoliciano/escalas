spring:
  application:
    name: escalas

  datasource:
    url: jdbc:postgresql://localhost:5432/escalas
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:Admin123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

jwt:
  secret: ${JWT_SECRET:jrPXx/NTcYiNEFi/aQEFE6cY6fYqWtn2yaTuqbl/1/A=}